name: Release

# Pushing a v* tag builds, signs, notarizes and publishes the app, then points the Homebrew tap at
# the new artifact. Nothing here needs a secret in the repository history: every credential is a
# GitHub secret, and the signing certificate lives only in a throwaway keychain on the runner.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # AppIcon.icon is an Icon Composer document and only Xcode 26's actool compiles it, so the image
    # matters. Measured from actions/runner-images: macos-26 ships Xcode 26.0.1-26.6 and defaults to
    # 26.6; macos-15 carries 26.0.1-26.3 but still defaults to 16.4. macos-26 also matches the
    # macOS 26 APIs the app builds against. The Xcode check below is kept anyway, so a regression in
    # the image fails the run instead of silently shipping an app with no icon.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$ref' is not a v<semver> tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "Building $ref as $version"

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          best=""
          best_version="0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v="$(/usr/bin/defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo 0)"
            if [ "$(printf '%s\n%s\n' "$v" "$best_version" | sort -V | tail -1)" = "$v" ]; then
              best="$app"; best_version="$v"
            fi
          done
          echo "Newest Xcode found: ${best:-none} ($best_version)"
          major="${best_version%%.*}"
          if [ -z "$best" ] || [ "${major:-0}" -lt 26 ]; then
            echo "::error::Xcode 26+ is required to compile AppIcon.icon (Icon Composer). Found ${best_version}." >&2
            echo "::error::Pin a runner image that ships Xcode 26, or drop AppIcon.icon from the build." >&2
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          echo "SELECTED_XCODE=$best" >> "$GITHUB_ENV"

      - name: Run the test suites
        run: |
          set -euo pipefail
          swift test
          node Scripts/conformance.mjs

      - name: Assert the checked-in project matches the generator
        run: |
          set -euo pipefail
          # Pinned via Gemfile.lock: predictabilize_uuids derives different identifiers across gem
          # versions, so an unpinned install rewrites every UUID and fails this check on a project
          # that is otherwise identical.
          bundle install --quiet
          cp FlowPeek.xcodeproj/project.pbxproj /tmp/pbxproj.before
          bundle exec ruby Scripts/generate_xcodeproj.rb >/dev/null
          if ! diff -q /tmp/pbxproj.before FlowPeek.xcodeproj/project.pbxproj >/dev/null; then
            echo "::error::FlowPeek.xcodeproj is stale. Run 'ruby Scripts/generate_xcodeproj.rb' and commit." >&2
            diff -u /tmp/pbxproj.before FlowPeek.xcodeproj/project.pbxproj | head -40 >&2
            exit 1
          fi

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set. See docs/RELEASING.md." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/flowpeek-signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt the runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::The imported certificate is not a Developer ID Application certificate." >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive -quiet \
            -project FlowPeek.xcodeproj \
            -scheme FlowPeek \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FlowPeek.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      - name: Export the app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FlowPeek.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          ls -la "$RUNNER_TEMP/export"
          /usr/bin/plutil -p "$RUNNER_TEMP/export/FlowPeek.app/Contents/Info.plist" \
            | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Confirm the icon actually shipped
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/FlowPeek.app"
          for resource in AppIcon.icns Assets.car mermaid.min.js flowpeek-glue.js en.lproj ko.lproj; do
            if [ ! -e "$app/Contents/Resources/$resource" ]; then
              echo "::error::$resource is missing from the exported app" >&2
              exit 1
            fi
          done
          echo "All expected resources are present."

      - name: Store notarization credentials
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          # Either credential shape works; the App Store Connect key is preferred for CI, and an
          # app-specific password is the quicker route for an individual account.
          if [ -n "${NOTARY_API_KEY:-}" ]; then
            echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials flowpeek \
              --keychain "$SIGNING_KEYCHAIN" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID"
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "${NOTARY_APPLE_ID:-}" ]; then
            xcrun notarytool store-credentials flowpeek \
              --keychain "$SIGNING_KEYCHAIN" \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD"
          else
            echo "::error::No notarization credentials. Set NOTARY_API_KEY/NOTARY_API_KEY_ID/NOTARY_API_ISSUER_ID, or NOTARY_APPLE_ID/NOTARY_PASSWORD/NOTARY_TEAM_ID. See docs/RELEASING.md." >&2
            exit 1
          fi

      - name: Build, notarize and staple the DMG
        id: dmg
        env:
          FLOWPEEK_APP_PATH: ${{ runner.temp }}/export/FlowPeek.app
          FLOWPEEK_DMG_PATH: ${{ runner.temp }}/FlowPeek-${{ steps.version.outputs.version }}.dmg
          FLOWPEEK_NOTARY_PROFILE: flowpeek
          FLOWPEEK_NOTARY_KEYCHAIN: ${{ env.SIGNING_KEYCHAIN }}
        run: |
          set -euo pipefail
          zsh Scripts/notarize_dmg.sh
          sha="$(shasum -a 256 "$FLOWPEEK_DMG_PATH" | awk '{print $1}')"
          echo "dmg=$FLOWPEEK_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FLOWPEEK_DMG_PATH")" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "Install with Homebrew:"
            echo
            echo '```sh'
            echo "brew install --cask flowpeek/tap/flowpeek"
            echo '```'
            echo
            echo "Or download \`${{ steps.dmg.outputs.name }}\` below."
            echo
            echo "SHA-256: \`${{ steps.dmg.outputs.sha256 }}\`"
          } > "$notes"
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.dmg.outputs.dmg }}" --clobber
            gh release edit "${{ steps.version.outputs.tag }}" --notes-file "$notes"
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "${{ steps.dmg.outputs.dmg }}" \
              --title "FlowPeek ${{ steps.version.outputs.version }}" \
              --notes-file "$notes"
          fi

      - name: Point the Homebrew tap at the new build
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set, so the tap was not updated. The release itself is published."
            exit 0
          fi
          # A deploy key scoped to the tap alone, rather than a personal access token that would
          # carry write access to everything the author can reach.
          key="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:FlowPeek/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cask="Casks/flowpeek.rb"
          /usr/bin/sed -i '' -E "s/^  version \".*\"$/  version \"${VERSION}\"/" "$cask"
          /usr/bin/sed -i '' -E "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" "$cask"
          # A no-op here means the cask did not actually change, which would silently ship a stale sha.
          if git diff --quiet -- "$cask"; then
            echo "::error::$cask was not modified. Check that its version and sha256 lines are quoted." >&2
            git diff --stat >&2
            exit 1
          fi
          grep -E "^  (version|sha256) " "$cask"
          git -c user.name="flowpeek-release" -c user.email="release@flowpeek.invalid" \
            commit -am "flowpeek ${VERSION}"
          git push
          rm -f "$key"
          echo "Tap updated to ${VERSION}."
