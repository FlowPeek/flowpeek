 102); stroke-width: 1;"></line><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(99, 99, 102); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="170.2" cy="214.60000000000002" r="5" fill="hsl(240, 23.8095238095%, NaN%)" stroke="hsl(240, 23.8095238095%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#000000" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(170.2, 219.60000000000002) rotate(0)">Campaign A</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#000000" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low Reach</text></g><g class="label"><text x="0" y="0" fill="#000000" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High Reach</text></g><g class="label"><text x="0" y="0" fill="#000000" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low Influence</text></g><g class="label"><text x="0" y="0" fill="#000000" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">High Influence</text></g></g><g class="title"><text x="0" y="0" fill="#000000" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Reach and engagement</text></g></g></svg>
