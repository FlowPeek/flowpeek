<svg id="fp-N" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#fp-N{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fp-N .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fp-N .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fp-N .error-icon{fill:#FFFFFF;}#fp-N .error-text{fill:#000000;stroke:#000000;}#fp-N .edge-thickness-normal{stroke-width:1px;}#fp-N .edge-thickness-thick{stroke-width:3.5px;}#fp-N .edge-pattern-solid{stroke-dasharray:0;}#fp-N .edge-thickness-invisible{stroke-width:0;fill:none;}#fp-N .edge-pattern-dashed{stroke-dasharray:3;}#fp-N .edge-pattern-dotted{stroke-dasharray:2;}#fp-N .marker{fill:#636366;stroke:#636366;}#fp-N .marker.cross{stroke:#636366;}#fp-N svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;}#fp-N p{margin:0;}#fp-N .node .neo-node{stroke:#636366;}#fp-N [data-look="neo"].node rect,#fp-N [data-look="neo"].cluster rect,#fp-N [data-look="neo"].node polygon{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].swimlane.cluster rect{filter:none;}#fp-N [data-look="neo"].node path{stroke:url(#fp-N-gradient);stroke-width:1px;}#fp-N [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node .neo-line path{stroke:#636366;filter:none;}#fp-N [data-look="neo"].node circle{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node circle .state-start{fill:#000000;}#fp-N [data-look="neo"].icon-shape .icon{fill:url(#fp-N