le .state-start{fill:#000000;}#fp-N [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fp-N [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fp-N .node rect,#fp-N .node circle,#fp-N .node polygon,#fp-N .node path{stroke-width:1.25px;}#fp-N .edgeLabel{background-color:transparent!important;}#fp-N .label,#fp-N .nodeLabel,#fp-N text{-webkit-font-smoothing:antialiased;}#fp-N .mindmap-node .label text,#fp-N .mindmap-node&gt;text{text-anchor:middle;}#fp-N :root{--mermaid-font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="461" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">Command/Read Model</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="186" height="100" stroke="#679ac3" fill="#bcd6fe"></rect><foreignObject x="260" y="25" width="166" height="80"><div style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle; color: rgb(28, 28, 30) !important;"><b>PlaceOrder</b></span></div></foreignObject></g><defs><marker id="em-arrowhead-fp-N" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333333"></polygon></marker></defs></svg>
