<svg id="fp-N" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 521px;" viewBox="-30 -30 521 190" role="graphics-document document" aria-roledescription="eventmodeling"><style>#fp-N{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;fill:#FFFFFF;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fp-N .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fp-N .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fp-N .error-icon{fill:#1C1C1E;}#fp-N .error-text{fill:#e3e3e1;stroke:#e3e3e1;}#fp-N .edge-thickness-normal{stroke-width:1px;}#fp-N .edge-thickness-thick{stroke-width:3.5px;}#fp-N .edge-pattern-solid{stroke-dasharray:0;}#fp-N .edge-thickness-invisible{stroke-width:0;fill:none;}#fp-N .edge-pattern-dashed{stroke-dasharray:3;}#fp-N .edge-pattern-dotted{stroke-dasharray:2;}#fp-N .marker{fill:#636366;stroke:#636366;}#fp-N .marker.cross{stroke:#636366;}#fp-N svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;}#fp-N p{margin:0;}#fp-N .node .neo-node{stroke:#636366;}#fp-N [data-look="neo"].node rect,#fp-N [data-look="neo"].cluster rect,#fp-N [data-look="neo"].node polygon{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].swimlane.cluster rect{filter:none;}#fp-N [data-look="neo"].node path{stroke:url(#fp-N-gradient);stroke-width:1px;}#fp-N [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node .neo-line path{stroke:#636366;filter:none;}#fp-N [data-look="neo"].node circle{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node circle .state-start{fill:#000000;}#fp-N [data-look="neo"].icon-shape .icon{fill:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].icon-shape .icon-neo path{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N .node rect,#fp-N .node circle,#fp-N .node polygon,#fp-N .node path{stroke-width:1.25px;}#fp-N .edgeLabel{background-color:transparent!important;}#fp-N .label,#fp-N .nodeLabel,#fp-N text{-webkit-font-smoothing:antialiased;}#fp-N :root{--mermaid-font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="461" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">Command/Read Model</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="186" height="100" stroke="#679ac3" fill="#bcd6fe"></rect></g><defs><marker id="em-arrowhead-fp-N" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#636366"></polygon></marker></defs></svg>
