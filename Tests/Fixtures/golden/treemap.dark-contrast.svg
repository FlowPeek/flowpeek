<svg id="fp-N" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="2 27 996 371" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#fp-N{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;fill:#FFFFFF;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fp-N .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fp-N .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fp-N .error-icon{fill:#1C1C1E;}#fp-N .error-text{fill:#e3e3e1;stroke:#e3e3e1;}#fp-N .edge-thickness-normal{stroke-width:1px;}#fp-N .edge-thickness-thick{stroke-width:3.5px;}#fp-N .edge-pattern-solid{stroke-dasharray:0;}#fp-N .edge-thickness-invisible{stroke-width:0;fill:none;}#fp-N .edge-pattern-dashed{stroke-dasharray:3;}#fp-N .edge-pattern-dotted{stroke-dasharray:2;}#fp-N .marker{fill:#98989D;stroke:#98989D;}#fp-N .marker.cross{stroke:#98989D;}#fp-N svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;}#fp-N p{margin:0;}#fp-N .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#fp-N .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#fp-N .treemapLabel{fill:#FFFFFF;font-size:12px;}#fp-N .treemapValue{fill:#FFFFFF;font-size:10px;}#fp-N .treemapTitle{fill:#e3e3e1;font-size:14px;}#fp-N .node .neo-node{stroke:#98989D;}#fp-N [data-look="neo"].node rect,#fp-N [data-look="neo"].cluster rect,#fp-N [data-look="neo"].node polygon{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].swimlane.cluster rect{filter:none;}#fp-N [data-look="neo"].node path{stroke:url(#fp-N-gradient);stroke-width:1px;}#fp-N [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node .neo-line path{stroke:#98989D;filter:none;}#fp-N [data-look="neo"].node circle{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node circle .state-start{fill:#000000;}#fp-N [data-look="neo"].icon-shape .icon{fill:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].icon-shape .icon-neo path{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N .node rect,#fp-N .node circle,#fp-N .node polygon,#fp-N .node path{stroke-width:1.25px;}#fp-N .edgeLabel{background-color:transparent!important;}#fp-N .label,#fp-N .nodeLabel,#fp-N text{-webkit-font-smoothing:antialiased;}#fp-N :root{--mermaid-font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;}</style><g></g><g transform="translate(0, 0)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"></rect><clipPath id="clip-section-fp-N-0"><rect width="988" height="25"></rect></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-fp-N-0)" style="display: none;"></text><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">30</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="980" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""></rect><clipPath id="clip-section-fp-N-1"><rect width="968" height="25"></rect></clipPath><rect width="980" height="355" class="treemapSection section1" fill="hsl