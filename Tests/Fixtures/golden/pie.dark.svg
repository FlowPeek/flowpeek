<svg id="fp-N" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550.578125 450" style="max-width: 550.578125px;" role="graphics-document document" aria-roledescription="pie"><style>#fp-N{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;fill:#FFFFFF;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fp-N .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fp-N .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fp-N .error-icon{fill:#1C1C1E;}#fp-N .error-text{fill:#e3e3e1;stroke:#e3e3e1;}#fp-N .edge-thickness-normal{stroke-width:1px;}#fp-N .edge-thickness-thick{stroke-width:3.5px;}#fp-N .edge-pattern-solid{stroke-dasharray:0;}#fp-N .edge-thickness-invisible{stroke-width:0;fill:none;}#fp-N .edge-pattern-dashed{stroke-dasharray:3;}#fp-N .edge-pattern-dotted{stroke-dasharray:2;}#fp-N .marker{fill:#636366;stroke:#636366;}#fp-N .marker.cross{stroke:#636366;}#fp-N svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;}#fp-N p{margin:0;}#fp-N .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#fp-N .pieCircle.highlighted{scale:1.05;opacity:1;}#fp-N .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#fp-N .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#fp-N .pieTitleText{text-anchor:middle;font-size:25px;fill:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;}#fp-N .slice{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;fill:#FFFFFF;font-size:17px;}#fp-N .legend text{fill:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:17px;}#fp-N .node .neo-node{stroke:#636366;}#fp-N [data-look="neo"].node rect,#fp-N [data-look="neo"].cluster rect,#fp-N [data-look="neo"].node polygon{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].swimlane.cluster rect{filter:none;}#fp-N [data-look="neo"].node path{stroke:url(#fp-N-gradient);stroke-width:1px;}#fp-N [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node .neo-line path{stroke:#636366;filter:none;}#fp-N [data-look="neo"].node circle{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].node circle .state-start{fill:#000000;}#fp-N [data-look="neo"].icon-shape .icon{fill:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N [data-look="neo"].icon-shape .icon-neo path{stroke:url(#fp-N-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fp-N .node rect,#fp-N .node circle,#fp-N .node polygon,#fp-N .node path{stroke-width:1.25px;}#fp-N .edgeLabel{background-color:transparent!important;}#fp-N .label,#fp-N .nodeLabel,#fp-N text{-webkit-font-smoothing:antialiased;}#fp-N :root{--mermaid-font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-167.623,-78.278L0,0Z" fill="#2C2C2E" class="pieCircle"></path><path d="M-167.623,-78.278A185,185,0,0,1,0,-185L0,0Z" fill="#3A3A3C" class="pieCircle"></path><text transform="translate(74.5177955801092,117.04127751302553)" class="slice" style="text-anchor: middle;">82%</text><text transform="translate(-74.51779558010921,-117.04127751302553)" class="slice" style="text-anchor: middle;">18%</text></g><text x="0" y="-200" class="pieTitleText">Pets</text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(44, 44, 46); stroke: rgb(44, 44, 46);"></rect><text x="22" y="14">Dogs</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="1